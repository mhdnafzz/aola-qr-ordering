<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aola Kitchen Arcade - Wait-Time Game</title>
  <meta name="description" content="Aola Kitchen Arcade: Flap your way through the kitchen exhaust pipes while your order prepares!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=4.2">
  <link rel="stylesheet" href="css/game.css?v=2.0">
  <link rel="icon" type="image/svg+xml" href="AU-dark-icon.svg">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #180D07;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
    }
    .game-modal-overlay {
      opacity: 1 !important;
      pointer-events: auto !important;
      position: relative !important;
      padding: 0 !important;
      height: 100vh !important;
      width: 100vw !important;
    }
    .game-modal-frame {
      transform: none !important;
      max-height: 100vh !important;
      height: 100vh !important;
      border-radius: 0 !important;
      max-width: 440px !important;
      box-shadow: 0 0 50px rgba(0,0,0,0.8) !important;
    }
  </style>
</head>
<body>

  <!-- Isolated Dedicated Wait-Time Game Simulation Interface -->
  <div class="game-modal-overlay open" id="game-modal-overlay" role="main" aria-label="Aola Kitchen Arcade">
    <div class="game-modal-backdrop" id="game-backdrop"></div>
    
    <!-- Premium Mobile Arcade Shell -->
    <div class="game-modal-frame" id="game-modal-frame">
      
      <!-- Top UI Overlays (Headers & Status & Score Board) -->
      <div class="game-top-section">
        <!-- Main Header: Dark Brown Pill Container -->
        <header class="game-main-header">
          <div class="game-header-brand">
            <span class="game-header-title">Aola Kitchen Arcade</span>
            <span class="game-live-pill">
              <span class="game-live-dot"></span>
              <span>Live</span>
            </span>
          </div>
          
          <div class="game-header-actions">
            <!-- Mute / Unmute Button -->
            <button type="button" class="game-btn-mute" id="game-sound-toggle" aria-label="Toggle Sound" title="Sound is Muted">
              <svg id="icon-sound-active" class="game-header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              </svg>
              <svg id="icon-sound-muted" class="game-header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <line x1="23" y1="9" x2="17" y2="15"/>
                <line x1="17" y1="9" x2="23" y2="15"/>
              </svg>
              <span id="sound-status-text">Mute</span>
            </button>

            <!-- Close Button -->
            <button type="button" class="game-btn-close" id="game-btn-close" aria-label="Close Arcade" title="Back to Order" onclick="window.location.href='index.html'">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </header>

        <!-- Status Bar: Glassmorphic Secondary Banner -->
        <div class="game-status-banner">
          <span class="game-status-text" id="game-status-order-text">Playing While Waiting • Order 124 is Preparing! 🍳</span>
        </div>

        <!-- Score Board: Dark Brown Tab Hanging Down -->
        <div class="game-score-tab" id="game-score-tab">
          <div class="game-score-label">SCORE</div>
          <div class="game-score-row">
            <span class="score-star left">★</span>
            <span class="game-score-number" id="game-dynamic-score">0</span>
            <span class="score-star right">★</span>
          </div>
        </div>
      </div>

      <!-- Blurred Warm Kitchen Background Image with Checkered Floor -->
      <div class="game-kitchen-bg" id="game-kitchen-bg"></div>

      <!-- Transparent Game Canvas -->
      <canvas id="flappy-restaurant-canvas" width="400" height="600"></canvas>

      <!-- Impact Red Shockwave Vignette -->
      <div class="impact-flash-vignette" id="game-impact-flash"></div>

      <!-- In-App Floating Toast Container -->
      <div class="game-toast-container" id="game-toast-container"></div>

      <!-- Dynamic DOM Overlays: Start Screen & Digital Receipt Leaderboard -->
      <div class="game-overlay-screen" id="game-overlay-screen">
        <div id="game-card-content" style="width: 100%; display: flex; justify-content: center;"></div>
      </div>

      <!-- Bottom UI (Glassmorphism & Calls to Action) -->
      <footer class="game-bottom-dock">
        <!-- Left Circular Leaderboard Button -->
        <div class="game-corner-btn-wrap left">
          <button type="button" class="game-circular-icon-btn" id="btn-open-leaderboard-left" aria-label="View Leaderboard" title="Leaderboard">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
              <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
              <path d="M4 22h16"></path>
              <path d="M10 14.66V17c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-2.34"></path>
              <path d="M14 14.66V17c0 .55.45 1 1 1h2c.55 0 1-.45 1-1v-2.34"></path>
              <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
            </svg>
          </button>
          <span class="game-corner-label">Leaderboard</span>
        </div>

        <!-- Center Frosted Glass Goal Card with Wings & Tap to Flap -->
        <div class="game-goal-card" id="game-goal-card" role="button" aria-label="Tap to Flap">
          <div class="goal-card-wing left" aria-hidden="true">
            <svg viewBox="0 0 32 20" width="26" height="17" fill="none">
              <path d="M30 3C22 3 14 7 2 17C12 17 20 13 30 10V3Z" fill="#D97746" stroke="#8E3C17" stroke-width="1.2"/>
              <path d="M30 6C24 6 18 9 8 17C16 17 22 14 30 12V6Z" fill="#F49D68"/>
              <circle cx="27" cy="7" r="2.8" fill="#FFE2C9" stroke="#8E3C17" stroke-width="1"/>
            </svg>
          </div>

          <div class="goal-card-inner">
            <div class="goal-card-header">Today's Goal:</div>
            <div class="goal-card-body">Beat the High Score to win today's secret comp! 🏆</div>
            <div class="goal-card-cta" id="game-tap-to-flap-cta">
              <span class="cta-text">TAP TO FLAP</span>
              <span class="cta-hand">👆</span>
            </div>
          </div>

          <div class="goal-card-wing right" aria-hidden="true">
            <svg viewBox="0 0 32 20" width="26" height="17" fill="none">
              <path d="M2 3C10 3 18 7 30 17C20 17 12 13 2 10V3Z" fill="#D97746" stroke="#8E3C17" stroke-width="1.2"/>
              <path d="M2 6C8 6 14 9 24 17C16 17 10 14 2 12V6Z" fill="#F49D68"/>
              <circle cx="5" cy="7" r="2.8" fill="#FFE2C9" stroke="#8E3C17" stroke-width="1"/>
            </svg>
          </div>
        </div>

        <!-- Right Circular Leaderboard Button -->
        <div class="game-corner-btn-wrap right">
          <button type="button" class="game-circular-icon-btn" id="btn-open-leaderboard-right" aria-label="View Leaderboard" title="Leaderboard">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 20V10"></path>
              <path d="M12 20V4"></path>
              <path d="M6 20v-6"></path>
            </svg>
          </button>
          <span class="game-corner-label">Leaderboard</span>
        </div>
      </footer>

      <!-- Simulated Mobile Home Indicator (Chin Swipe Bar) -->
      <div class="sim-phone-home-indicator"></div>
    </div>
  </div>

  <script src="js/game.js?v=2.0"></script>
  <script>
    // Gatekeeper: Validate order and session token before launching
    window.addEventListener("DOMContentLoaded", () => {
      const modal = document.getElementById("game-modal-overlay");
      if (modal) modal.classList.add("open");

      const params = new URLSearchParams(window.location.search);
      const orderId = params.get("order_id") || params.get("order");
      const token = params.get("token") || params.get("session_token");

      if (window.initFlappyArcade) {
        window.initFlappyArcade();
      }

      // If no verified order is present, the gatekeeper automatically shows the locked screen
      if (orderId && token && window.startNewGameSession) {
        window.startNewGameSession(orderId, token);
      } else if (window.showLockedGatekeeperScreen) {
        window.showLockedGatekeeperScreen("Direct Link Blocked: Please place your food order from your dining table to unlock the Aola Kitchen Arcade.");
      }
    });
  </script>
</body>
</html>
